<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ניהול · sapinails.il</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FAE9EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ספיר · ניהול">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&amp;family=Frank+Ruhl+Libre:wght@400;500&amp;family=Playpen+Sans+Hebrew:wght@400&amp;family=Ms+Madi&amp;display=swap">
<style>
:root{
  --bg:#FAE9EE;--surface:#FFFAFB;--surface-2:#F6E1E8;
  --ink:#2E1D24;--ink-2:#7D5566;--ink-3:#A48D98;
  --line:#F0D7E0;--line-strong:#E5C1CE;
  --accent:#BE4B74;--accent-hover:#A63D63;--accent-ink:#FFFFFF;--accent-soft:#F8DCE6;--accent-soft-ink:#A33B63;
  --warn:#A65A14;
  --wa:#157F4A;--wa-hover:#10683C;--wa-ink:#FFFFFF;--wa-ring:rgba(21,127,74,.45);
  --bubble:#E4F4E9;--bubble-ink:#1F2A22;
  --danger:#B3261E;--danger-ink:#FFFFFF;--danger-soft:#FCE4E1;
  --card-flat:#F7DAE2;--card-ink:#2E1D24;--card-ink-2:#7D5566;--sheen:rgba(255,255,255,.38);
  --rose-ink:#C4567E;--marker:#D9809F;
  --nail-empty-fill:rgba(255,255,255,.6);--nail-empty-stroke:#D9AFBF;--nail-edge:rgba(90,25,50,.2);
  --shadow-sm:0 1px 2px rgba(120,40,70,.07);
  --shadow-md:0 18px 36px -18px rgba(190,75,116,.35),0 3px 8px rgba(120,40,70,.06);
  --fab-shadow:0 14px 30px -12px rgba(190,75,116,.6),0 2px 6px rgba(0,0,0,.08);
  --backdrop:rgba(42,18,30,.4);
  --font-display:"Frank Ruhl Libre","David Libre",David,Georgia,serif;
  --font-hand:"Playpen Sans Hebrew","Assistant",cursive;
  --font-script:"Ms Madi","Mrs Saint Delafield",cursive;
  --font-ui:"Assistant","Heebo","Arial Hebrew","Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#161014;--surface:#20161B;--surface-2:#2B1F25;
    --ink:#F6E9EE;--ink-2:#BEA4AF;--ink-3:#8E7582;
    --line:#33262D;--line-strong:#4A3842;
    --accent:#EE88AA;--accent-hover:#F6A2BE;--accent-ink:#2A0E1A;--accent-soft:#3E2230;--accent-soft-ink:#F4B5CA;
    --warn:#F0B26F;
    --wa:#3CC97E;--wa-hover:#5BD894;--wa-ink:#06200F;--wa-ring:rgba(60,201,126,.4);
    --bubble:#1C3325;--bubble-ink:#E4F4E9;
    --danger:#FF8C84;--danger-ink:#2A0B08;--danger-soft:#3B1E1C;
    --card-flat:#2E1E26;--rose-ink:#E3A0BA;--marker:#7A3550;--card-ink:#F8EAF0;--card-ink-2:#C9ABB8;--sheen:rgba(255,255,255,.07);
    --nail-empty-fill:rgba(255,255,255,.04);--nail-empty-stroke:#6C5261;--nail-edge:rgba(255,255,255,.22);
    --shadow-sm:0 1px 2px rgba(0,0,0,.45);
    --shadow-md:0 20px 40px -20px rgba(0,0,0,.8),0 2px 6px rgba(0,0,0,.4);
    --fab-shadow:0 14px 30px -12px rgba(0,0,0,.75),0 2px 6px rgba(0,0,0,.4);
    --backdrop:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161014;--surface:#20161B;--surface-2:#2B1F25;
  --ink:#F6E9EE;--ink-2:#BEA4AF;--ink-3:#8E7582;
  --line:#33262D;--line-strong:#4A3842;
  --accent:#EE88AA;--accent-hover:#F6A2BE;--accent-ink:#2A0E1A;--accent-soft:#3E2230;--accent-soft-ink:#F4B5CA;
  --warn:#F0B26F;
  --wa:#3CC97E;--wa-hover:#5BD894;--wa-ink:#06200F;--wa-ring:rgba(60,201,126,.4);
  --bubble:#1C3325;--bubble-ink:#E4F4E9;
  --danger:#FF8C84;--danger-ink:#2A0B08;--danger-soft:#3B1E1C;
  --card-flat:#2E1E26;--rose-ink:#E3A0BA;--marker:#7A3550;--card-ink:#F8EAF0;--card-ink-2:#C9ABB8;--sheen:rgba(255,255,255,.07);
  --nail-empty-fill:rgba(255,255,255,.04);--nail-empty-stroke:#6C5261;--nail-edge:rgba(255,255,255,.22);
  --shadow-sm:0 1px 2px rgba(0,0,0,.45);
  --shadow-md:0 20px 40px -20px rgba(0,0,0,.8),0 2px 6px rgba(0,0,0,.4);
  --fab-shadow:0 14px 30px -12px rgba(0,0,0,.75),0 2px 6px rgba(0,0,0,.4);
  --backdrop:rgba(0,0,0,.6);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--bg)}
html.locked,html.locked body{overflow:hidden}
body{color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg{display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.defs{position:absolute;width:0;height:0;overflow:hidden}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.flip{transform:scaleX(-1)}

.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:18px 128px;display:flex;flex-direction:column;gap:16px}

/* header */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-top:4px}
.eyebrow{font-size:12.5px;font-weight:800;letter-spacing:.05em;color:var(--accent)}
.studio{font-family:var(--font-display);font-weight:400;font-size:clamp(30px,8.4vw,38px);line-height:1.08;margin:2px 0 6px;text-wrap:balance}
.sub{font-size:14.5px;color:var(--ink-2);min-height:1.5em;font-variant-numeric:tabular-nums}
.icon-btn{width:44px;height:44px;flex:none;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;box-shadow:var(--shadow-sm)}
.icon-btn:hover{border-color:var(--line-strong)}

/* banner */
.banner{border:1px solid var(--line-strong);background:var(--surface);border-radius:16px;padding:12px 14px;font-size:14.5px;line-height:1.5}
.banner strong{font-weight:800}

/* toolbar */
.toolbar{display:flex;flex-direction:column;gap:12px}
.search{position:relative;display:block}
.search svg{position:absolute;inset-inline-start:15px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}
.search input{width:100%;height:50px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding-inline:46px 18px;font-size:16px;outline:none;-webkit-appearance:none;appearance:none;box-shadow:var(--shadow-sm)}
.search input::placeholder{color:var(--ink-3)}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;padding-block:2px}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;margin-inline:0;padding-inline:0}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-2);font-weight:700;font-size:14.5px;white-space:nowrap}
.chip .n{font-variant-numeric:tabular-nums;font-weight:800;color:var(--ink-3)}
.chip[aria-pressed="true"],.chip[aria-checked="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip[aria-pressed="true"] .n{color:var(--bg);opacity:.75}

/* client list */
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--shadow-sm)}
.row{display:flex;align-items:center;gap:4px;padding-inline:6px 12px}
.row+.row{border-top:1px solid var(--line)}
.row-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:none;border:0;padding:12px 8px;text-align:start;border-radius:16px}
.row-main:hover .nm{color:var(--accent)}
.avatar{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-size:21px;line-height:1;background:var(--av);color:var(--av-ink);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.row-text{min-width:0;display:flex;flex-direction:column;gap:5px}
.row-name{display:flex;align-items:center;gap:8px;min-width:0;font-weight:700;font-size:16.5px;line-height:1.25}
.row-name .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color .15s}
.row-meta{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;font-size:13.5px;color:var(--ink-2)}
.count{font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.when{white-space:nowrap}
.away{color:var(--warn);font-weight:700}
.pill{flex:none;font-size:11.5px;font-weight:800;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.gift{background:linear-gradient(135deg,#F9E7EE,#EFD3DE 50%,#F6E6D2);color:#7A3B52}
.punch-quick{width:46px;height:46px;flex:none;border-radius:50%;border:0;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-soft-ink);transition:transform .12s}
.punch-quick:active{transform:scale(.92)}
.punch-quick.gift{background:linear-gradient(135deg,#FBEFF3,#E7C3D2 45%,#F8E8D5 75%,#DDB9CB);color:#6A3348}
.punch-quick:disabled{opacity:.4;cursor:not-allowed}
.no-results{padding:28px 16px;text-align:center;color:var(--ink-2);background:var(--surface);border:1px dashed var(--line-strong);border-radius:18px}

/* nails */
.nails{display:flex;align-items:flex-end}
.nails.mini{display:inline-flex;gap:3px}
.nails.mini .nail{width:9px;height:13px}
.nails.mid{gap:5px;flex-wrap:wrap}
.nails.mid .nail{width:17px;height:23px}
.nails.big{display:grid;justify-content:center;align-items:end;gap:10px 9px;margin-block:16px 18px}
.nails.big .nail,.nails.big .nailbox{width:34px;height:47px}
.nails.big.dense .nail,.nails.big.dense .nailbox{width:29px;height:40px}
.nailbox{position:relative;display:block}
.nailbox .nail{position:absolute;inset:0;width:100%;height:100%}
.nail .slot{fill:var(--nail-empty-fill);stroke:var(--nail-empty-stroke);stroke-width:1.3;stroke-dasharray:3.2 2.6}
.nail .edge{stroke:var(--nail-edge);stroke-width:1}
.nail .num{font-family:var(--font-ui);font-size:10.5px;font-weight:800;fill:var(--ink-3);text-anchor:middle}
.nail .spark-off{fill:none;stroke:var(--nail-empty-stroke);stroke-width:1.2;stroke-linejoin:round}
.nail .spark-on{fill:#fff;stroke:#BF946B;stroke-width:.8;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.nail.painting{animation:paint .8s cubic-bezier(.3,.7,.2,1) both}
.nail.gift-ready .spark-on{animation:twinkle 2.8s ease-in-out infinite}
@keyframes paint{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes twinkle{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}

/* the punch card */
.pcard{position:relative;overflow:hidden;border-radius:24px;padding:18px 18px 18px;color:var(--card-ink);background:var(--card-flat);border:1px solid var(--line);box-shadow:var(--shadow-md)}
.pc-rose{position:absolute;left:-4px;top:-18px;width:136px;height:136px;color:var(--card-flat);pointer-events:none}
.pc-rose g{stroke:var(--rose-ink)}
.pcard::after{content:"";position:absolute;top:-60%;inset-inline-end:-25%;width:75%;height:190%;background:linear-gradient(105deg,transparent 35%,var(--sheen) 50%,transparent 64%);transform:rotate(10deg);pointer-events:none}
.pcard.is-full{box-shadow:0 0 0 1.5px rgba(196,150,112,.55),var(--shadow-md)}
.pcard-top{position:relative;z-index:1;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.pcard-eyebrow{position:relative;isolation:isolate;display:inline-block;padding:3px 16px 7px;font-family:var(--font-display);font-weight:500;font-size:19px;line-height:1.15;color:var(--card-ink)}
.pcard-eyebrow svg{position:absolute;left:0;top:0;width:100%;height:100%;z-index:-1}
.pcard-eyebrow .mk{fill:var(--marker)}
.pcard-studio{font-family:var(--font-script);font-size:34px;line-height:1.05;color:var(--accent);margin:2px 6px 0 0}
.pcard-foot{position:relative;z-index:1;display:flex;align-items:flex-end;justify-content:space-between;gap:8px 12px;flex-wrap:wrap}
.pcard-who{min-width:0}
.pcard-no{flex:none;font-size:12px;font-weight:800;color:var(--card-ink-2);background:var(--card-flat);border:1px solid var(--line-strong);border-radius:999px;padding:3px 10px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pcard-name{position:relative;z-index:1;font-family:var(--font-hand);font-weight:400;font-size:27px;line-height:1.2;text-wrap:balance}
.pcard-status{position:relative;z-index:1;margin-top:5px;font-size:14.5px;color:var(--card-ink-2);font-variant-numeric:tabular-nums}
.pcard-status b{color:var(--card-ink);font-weight:800}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:999px;border:1px solid transparent;font-weight:700;font-size:16px;line-height:1.1;text-decoration:none;white-space:nowrap;transition:background-color .15s,border-color .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.big{width:100%;min-height:58px;font-size:18px;font-weight:800}
.btn.primary.big{box-shadow:0 12px 24px -14px var(--accent)}
.btn.chrome{background:linear-gradient(135deg,#FBEFF3 0%,#E7C3D2 40%,#F8E8D5 70%,#DDB9CB 100%);color:#4A2233;border-color:rgba(170,120,95,.4)}
.btn.wa{background:var(--wa);color:var(--wa-ink)}
.btn.wa:hover{background:var(--wa-hover)}
.btn.wa.nudge{animation:ring 1.6s ease-out 3}
@keyframes ring{0%{box-shadow:0 0 0 0 var(--wa-ring)}100%{box-shadow:0 0 0 14px transparent}}
.btn.ghost{background:var(--surface);border-color:var(--line-strong);color:var(--ink)}
.btn.ghost:hover{border-color:var(--ink-3)}
.btn.danger{background:var(--danger);color:var(--danger-ink)}
.text-btn{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:8px 4px;min-height:40px;color:var(--accent);font-weight:700;font-size:15px}
.text-btn.danger-txt{color:var(--danger)}
.head-btn{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);font-weight:700;font-size:14.5px;flex:none}
.mini-btn{display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);font-size:13.5px;font-weight:700;color:var(--ink-2)}
.mini-btn svg.i{width:16px;height:16px}
.fab{position:fixed;z-index:20;bottom:calc(18px + env(safe-area-inset-bottom,0px));inset-inline-end:max(16px,calc(50% - 264px));min-height:56px;padding-inline:20px 24px;font-size:17px;font-weight:800;box-shadow:var(--fab-shadow)}

/* sheets */
.layer{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center}
.backdrop{position:absolute;inset:0;background:var(--backdrop);animation:fade .2s ease both}
.sheet{position:relative;width:100%;max-width:560px;max-height:calc(100% - 18px - env(safe-area-inset-top,0px));display:flex;flex-direction:column;background:var(--bg);border-radius:26px 26px 0 0;box-shadow:0 -14px 40px -14px rgba(0,0,0,.35);padding-bottom:env(safe-area-inset-bottom,0px);animation:rise .3s cubic-bezier(.2,.8,.2,1) both}
.sheet-inner{display:flex;flex-direction:column;min-height:0;flex:1}
.grab{width:42px;height:5px;border-radius:99px;background:var(--line-strong);margin:8px auto 0;flex:none}
.sheet-head{display:flex;align-items:center;gap:8px;padding:8px 16px 10px;flex:none}
.sheet-title{flex:1;min-width:0;margin:0;font-family:var(--font-display);font-weight:400;font-size:25px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;outline:none}
.sheet-body{overflow-y:auto;overscroll-behavior:contain;padding:4px 16px 28px;flex:1;min-height:0}
@keyframes rise{from{transform:translateY(48px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (min-width:720px){
  .layer{align-items:center;padding:24px}
  .sheet{border-radius:26px;max-height:min(880px,100%)}
}

/* client sheet */
.actions{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.actions-row{display:flex;gap:10px}
.actions-row>.btn{flex:1;min-width:0}
.info{margin:22px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.info-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 14px;min-height:52px}
.info-row+.info-row{border-top:1px solid var(--line)}
.info dt{font-size:13.5px;color:var(--ink-2);flex:none}
.info dd{margin:0;display:flex;align-items:center;gap:10px;font-weight:600;text-align:end;min-width:0;font-variant-numeric:tabular-nums}
.info-row.notes{align-items:flex-start}
.info-row.notes dd{white-space:pre-wrap;font-weight:500;line-height:1.45}
.phone{font-variant-numeric:tabular-nums;user-select:all;-webkit-user-select:all;font-weight:700;letter-spacing:.01em}
.muted{color:var(--ink-3);font-weight:500}
.sec-title{margin:0 0 6px;font-size:13.5px;font-weight:800;color:var(--ink-2)}
.hist{margin-top:22px}
.hist ol{list-style:none;margin:0;padding:0}
.hist li{display:flex;justify-content:space-between;gap:12px;padding:10px 2px;border-bottom:1px dashed var(--line-strong);font-size:14.5px}
.hist time{color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.danger{margin-top:18px}
.confirm{display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:16px;border:1px solid var(--danger);background:var(--danger-soft)}
.confirm p{margin:0;font-weight:600}

/* whatsapp sheet */
.wa-body{display:flex;flex-direction:column;gap:14px}
.bubble-wrap{display:flex}
.bubble{width:100%;margin-inline-end:28px;background:var(--bubble);color:var(--bubble-ink);border-radius:20px 20px 20px 6px;padding:13px 15px;font-size:15.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word;box-shadow:var(--shadow-sm);border:1px solid transparent}
textarea.bubble-edit{min-height:250px;resize:vertical;border-color:var(--line-strong);outline:none;font-family:var(--font-ui)}
textarea.bubble-edit:focus{border-color:var(--wa)}
.wa-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--ink-2)}
.fine{margin:0;font-size:13px;color:var(--ink-2)}
.warn-txt{color:var(--warn);font-weight:700}

/* forms */
.form{display:flex;flex-direction:column;gap:18px}
.field{display:flex;flex-direction:column;gap:7px;margin:0;padding:0;border:0;min-width:0}
.field>label,.legend{font-size:14.5px;font-weight:800;padding:0}
.opt{font-weight:500;color:var(--ink-3)}
.input{width:100%;min-height:50px;border:1px solid var(--line-strong);border-radius:14px;background:var(--surface);padding:12px 14px;font-size:16px;outline:none}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.input.ltr{text-align:right}
textarea.input{resize:vertical;min-height:84px;line-height:1.45}
.help{margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.5}
.err{font-size:13.5px;font-weight:700;color:var(--danger)}
.seg{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--surface-2)}
.seg label{flex:1;position:relative}
.seg input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.seg span{display:flex;align-items:center;justify-content:center;min-height:42px;border-radius:999px;font-weight:700;color:var(--ink-2)}

function normSettings(d) {

    cardSize: Number.isFinite(n) && n >= 3 && n <= 12 ? n : DEFAULTS.cardSize,
    ownerPhone: typeof d.ownerPhone === 'string' ? d.ownerPhone.trim().slice(0, 20) : DEFAULTS.ownerPhone,

}
function cardLink(c) {
  let base = S.settings.siteUrl.replace(/[#?].*$/, '').replace(/\/+$/, '');
  if (!base) return '';
  if (!/^https?:\/\//i.test(base)) base = 'https://' + base;
  const N = S.settings.cardSize, p = Math.min(c.punches, N), no = c.rewards + 1;
  // a claude.ai page reads the card from the #hash; the public card pages read it from the path, which WhatsApp turns into a card image
  if (/claude\.ai\/(code\/)?artifact\//i.test(base)) return `${base}#k${p}-${N}-${no}`;
  return `${base}/k/${N}/${p}/?c=${no}`;
}
function normClient(id, d) {

    g: d.g === 'm' ? 'm' : 'f',

    punches: int0(d.punches), rewards: int0(d.rewards), visits: int0(d.visits),

function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function shade(i, N) {
  const t = N <= 1 ? 1 : i / (N - 1);
  const x = t * (STOPS.length - 1);
  const k = Math.min(STOPS.length - 2, Math.floor(x));
  const f = x - k, a = hex2rgb(STOPS[k]), b = hex2rgb(STOPS[k + 1]);
  return '#' + a.map((v, j) => Math.round(v + (b[j] - v) * f).toString(16).padStart(2, '0')).join('');
}
function avatarColors(name) {
  let h = 0; for (const ch of String(name)) h = (h * 31 + ch.codePointAt(0)) >>> 0;
  const idx = h % STOPS.length;
  return { bg: STOPS[idx], ink: idx >= 4 ? '#FFFFFF' : '#3A1F2B' };
}

function localDigits(p) {
  let d = String(p || '').replace(/\D/g, '');
  if (d.startsWith('00')) d = d.slice(2);
  if (d.startsWith('972')) d = '0' + d.slice(3);
  return d;
}
function fmtPhone(p) {
  const d = localDigits(p);
  if (/^05\d{8}$/.test(d)) return `${d.slice(0, 3)}-${d.slice(3, 6)}-${d.slice(6)}`;
  if (/^0[2-9]\d{7}$/.test(d)) return `${d.slice(0, 2)}-${d.slice(2, 5)}-${d.slice(5)}`;
  return String(p || '').trim();
}
function waNumber(p) {
  let d = String(p || '').replace(/\D/g, '');
  if (!d) return '';
  if (d.startsWith('00')) d = d.slice(2);
  if (d.startsWith('972')) return d;
  if (d.startsWith('0')) return '972' + d.slice(1);
  if (d.length === 9 && d.startsWith('5')) return '972' + d;
  return d;
}
function waHref(phone, text) { return `https://wa.me/${waNumber(phone)}?text=${encodeURIComponent(text)}`; }

function rel(ms) {
  if (!ms) return '';
  const a = new Date(); a.setHours(0, 0, 0, 0);
  const b = new Date(ms); b.setHours(0, 0, 0, 0);
  const days = Math.round((a - b) / DAY);
  if (days <= 0) return 'היום';
  if (days === 1) return 'אתמול';
  if (days === 2) return 'שלשום';
  if (days < 14) return `לפני ${days} ימים`;
  if (days < 21) return 'לפני שבועיים';
  if (days < 30) return 'לפני 3 שבועות';
  if (days < 60) return 'לפני חודש';
  if (days < 90) return 'לפני חודשיים';
  return `לפני ${Math.floor(days / 30)} חודשים`;
}
const fmtDate = ms => new Date(ms).toLocaleDateString('he-IL', { day: 'numeric', month: 'numeric', year: '2-digit' });
const isAway = c => { const ref = c.lastVisit || c.createdAt; return !!ref && Date.now() - ref > AWAY_DAYS * DAY; };
const lastSeen = c => (c.lastVisit ? rel(c.lastVisit) : 'טרם נרשם ביקור');
const studioName = () => S.settings.studioName;

function monthStats() {
  const s = new Date(); s.setDate(1); s.setHours(0, 0, 0, 0);
  const from = s.getTime();
  let visits = 0, gifts = 0;
  S.clients.forEach(c => c.log.forEach(e => {
    if (e.t < from) return;
    if (e.a === 'punch') visits++;
    else if (e.a === 'redeem') { visits++; gifts++; }
  }));
  return { visits, gifts };
}

/* ---------- nails ---------- */
function nail(kind, o = {}) {
  const cls = o.cls ? ' ' + o.cls : '';
  if (kind === 'full') {
    return `<svg class="nail${cls}" viewBox="0 0 32 44" aria-hidden="true"><path class="edge" d="${NAIL}" style="fill:${o.color}"/><path d="${SHINE}" fill="#fff" opacity=".5"/><ellipse cx="12.6" cy="8.8" rx="1" ry="1.6" fill="#fff" opacity=".55"/></svg>`;
  }
  if (kind === 'empty') {
    return `<svg class="nail${cls}" viewBox="0 0 32 44" aria-hidden="true"><path class="slot" d="${NAIL}"/>${o.n ? `<text class="num" x="16" y="29.5">${o.n}</text>` : ''}</svg>`;
  }
  if (kind === 'gift-on') {
    return `<svg class="nail gift-ready${cls}" viewBox="0 0 32 44" aria-hidden="true"><path class="edge" d="${NAIL}" fill="url(#chrome)"/><path d="${SHINE}" fill="#fff" opacity=".75"/><path class="spark-on" d="${SPARK}"/></svg>`;
  }
  return `<svg class="nail${cls}" viewBox="0 0 32 44" aria-hidden="true"><path class="slot" d="${NAIL}"/><path class="spark-off" d="${SPARK}"/></svg>`;
}
function nailRow(p, N, size, paintIdx = -1, dates = null) {
  const f = Math.min(p, N), full = p >= N;
  const cell = (h, i) => (dates ? `<span class="nailcell">${h}<span class="nd">${i != null && i < f ? nailDate(dates[i]) : ''}</span></span>` : h);
  let out = '';
  for (let i = 0; i < N; i++) {
    if (i < f) {
      const col = shade(i, N);
      out += cell(i === paintIdx && size === 'big'
        ? `<span class="nailbox">${nail('empty', { n: i + 1 })}${nail('full', { color: col, cls: 'painting' })}</span>`
        : nail('full', { color: col }), i);
    } else {
      out += cell(nail('empty', { n: size === 'big' ? i + 1 : '' }), i);
    }
  }
  out += cell(nail(full ? 'gift-on' : 'gift-off'), null);
  const total = N + 1;
  let attrs = '';
  let cls = `nails ${size}`;
  if (size === 'big') {
    const cols = total <= 7 ? total : Math.ceil(total / 2);
    attrs = ` style="grid-template-columns:repeat(${cols},auto)"`;
    if (total > 7) cls += ' dense';
  }
  const label = full ? `הכרטיסייה מלאה, ${N} מתוך ${N}` : `${f} מתוך ${N} ניקובים`;
  return `<div class="${cls}" role="img" aria-label="${label}"${attrs}>${out}</div>`;
}

/* ---------- messages ---------- */
function progressLines(p, N) {
  const f = Math.min(p, N), RLM = '‏';
  const cells = [];
  for (let i = 0; i < N; i++) cells.push(i < f ? '💖' : '🤍');
  if (N <= 8) return RLM + cells.join('') + ' 🎁';
  const half = Math.ceil(N / 2);
  return RLM + cells.slice(0, half).join('') + '\n' + RLM + cells.slice(half).join('') + ' 🎁';
}
function statusLine(p, N) {
  const f = Math.min(p, N), left = N - f;
  if (p <= 0) return 'הניקוב הראשון מחכה לך בטיפול הבא ✨';
  if (left <= 0) return '*הכרטיסייה מלאה!* הטיפול הבא שלך מתנה ממני 🎁';
  return `*${f} מתוך ${N}* · עוד ${left === 1 ? 'טיפול אחד' : left + ' טיפולים'} ואז טיפול מתנה ממני 🎁`;
}
function buildMessage(tpl, c) { return cardMessage(tpl, c); }
function buildMessageBuiltin(tpl, c) {

  const prog = progressLines(p, N), st = statusLine(p, N);

  switch (tpl) {
    case 'welcome':
      return `היי ${name} 💕\n${gw(c, 'ברוכה הבאה', 'ברוך הבא')} לכרטיסיית המועדון שלי!\nעל כל טיפול ${gw(c, 'את מקבלת', 'אתה מקבל')} ניקוב, ואחרי ${N} טיפולים הטיפול הבא מתנה ממני 🎁\n\nהכרטיסייה שלך:\n${prog}\n${st}${sig}`;
    case 'visit':
      if (p >= N) return `היי ${name} 🎉\nתודה שבאת היום! הכרטיסייה שלך התמלאה:\n${prog}\n*הטיפול הבא שלך מתנה ממני* 🎁 מחכה לפנק אותך!${sig}`;
      return `היי ${name} 💕\nתודה שבאת היום ✨\nהוספתי לך ניקוב בכרטיסייה:\n${prog}\n${st}${sig}`;
    case 'redeem':
      return `היי ${name} 💝\n${gw(c, 'תתחדשי', 'תתחדש')} על טיפול המתנה! תודה ש${gw(c, 'את', 'אתה')} איתי 💕\nפתחתי לך כרטיסייה חדשה:\n${prog}\n${st}${sig}`;
    case 'reminder':
      return `היי ${name} 💕\nמתגעגעת! עבר קצת זמן מאז הטיפול האחרון, אולי הגיע הזמן לחדש את הציפורניים? 💅\n\n${prog}\n${st}\n\nלקביעת תור אפשר פשוט להשיב להודעה הזו ✨${link ? `\nהכרטיסייה שלך: ${link}` : ''}${studio ? `\n${studio}` : ''}`;
    default:
      return `היי ${name} 💕\nעדכון מהכרטיסייה שלך:\n${prog}\n${st}${sig}`;

}
function buildSummary() {
  const N = S.settings.cardSize;
  const list = [...S.clients.values()].sort((a, b) => a.name.localeCompare(b.name, 'he'));
  const gifts = list.filter(c => c.punches >= N), away = list.filter(isAway), m = monthStats();
  const date = new Date().toLocaleDateString('he-IL', { day: 'numeric', month: 'numeric', year: 'numeric' });
  let t = `📋 *סיכום כרטיסיות${studioName() ? ' · ' + studioName() : ''}*\n${date}\n${plural(list.length, 'לקוחה אחת', 'לקוחות')} · ${plural(m.visits, 'טיפול אחד', 'טיפולים')} החודש`;
  if (gifts.length) t += `\n\n🎁 *מתנה מוכנה (${gifts.length})*\n` + gifts.map(c => `• ${c.name}`).join('\n');
  if (away.length) t += `\n\n⏳ *מזמן לא הגיעו (${away.length})*\n` + away.map(c => `• ${c.name} · ${lastSeen(c)}`).join('\n');
  if (list.length) {
    const MAX = 60;
    t += `\n\n💅 *כל הכרטיסיות*\n` + list.slice(0, MAX).map(c => `• ${c.name} · ${Math.min(c.punches, N)}/${N}`).join('\n');
    if (list.length > MAX) t += `\nועוד ${list.length - MAX}`;

function fmtWa(text) {
  return esc(text)
    .replace(/\*([^*\n]+)\*/g, '<b>$1</b>')
    .replace(/(^|\s)_([^_\n]+)_/g, '$1<i>$2</i>');
}
function defaultTpl(c) {
  const last = c.log[c.log.length - 1];

function visibleClients() {
  const N = S.settings.cardSize, q = S.q.trim().toLowerCase(), qd = q.replace(/\D/g, '');
  let arr = [...S.clients.values()];
  if (S.filter === 'gift') arr = arr.filter(c => c.punches >= N);
  if (S.filter === 'away') arr = arr.filter(isAway);
  if (q) arr = arr.filter(c => c.name.toLowerCase().includes(q) || (qd.length >= 3 && localDigits(c.phone).includes(qd)));
  const ref = c => c.lastVisit || c.createdAt || 0;
  if (S.filter === 'away') arr.sort((a, b) => ref(a) - ref(b));
  else arr.sort((a, b) => ref(b) - ref(a) || a.name.localeCompare(b.name, 'he'));

function renderHeader() {
  const name = studioName();
  $('#studio').textContent = name || 'כרטיסיית מועדון';
  $('#eyebrow').hidden = !name;
  let sub = '';
  if (S.status === 'ready') {
    const m = monthStats();
    const month = new Intl.DateTimeFormat('he-IL', { month: 'long' }).format(new Date());
    sub = m.visits === 0
      ? `עוד אין טיפולים ב${month}`
      : `${plural(m.visits, 'טיפול אחד', 'טיפולים')} ב${month}${m.gifts ? ' · ' + plural(m.gifts, 'מתנה אחת', 'מתנות') : ''}`;
  }

}
function renderBanner() {
  const b = $('#banner');

function renderToolbar() {

  let gift = 0, away = 0;

function renderCards() {

      : spec.type === 'apptForm' ? apptFormHTML(spec) : spec.type === 'blockForm' ? blockFormHTML(spec)
      : spec.type === 'tplForm' ? tplFormHTML(spec) : svcFormHTML(spec);
  } else return;
  if (html === spec.lastHTML) return;
  const body = $('.sheet-body', spec.inner);
  const top = body ? body.scrollTop : 0;
  spec.inner.innerHTML = html;
  spec.lastHTML = html;
  const nb = $('.sheet-body', spec.inner);
  if (nb && !first) nb.scrollTop = top;
  if (first && spec.type === 'apptForm') updateFreeChips(spec);
}

/* ---------- toasts & copy ---------- */
function toast(msg, actions = []) {
  const box = $('#toasts');
  while (box.children.length >= 2) box.firstChild.remove();
  const el = document.createElement('div');
  el.className = 'toast';
  const span = document.createElement('span');
  span.className = 't-msg';
  span.textContent = msg;
  el.appendChild(span);
  span.addEventListener('click', () => el.remove());
  actions.forEach(a => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = a.label;
    b.addEventListener('click', () => { el.remove(); a.fn(); });
    el.appendChild(b);
  });
  box.appendChild(el);
  setTimeout(() => el.remove(), actions.length ? 7000 : 4000);
}
function copyText(text, fallbackEl) {
  const fallback = () => {
    if (!fallbackEl) return toast('ההעתקה לא הצליחה');
    if (fallbackEl.select) { fallbackEl.focus(); fallbackEl.select(); }
    else { const r = document.createRange(); r.selectNodeContents(fallbackEl); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); }
    toast('הטקסט מסומן, אפשר להעתיק ידנית');
  };
  try {
    navigator.clipboard.writeText(text).then(() => toast('הועתק'), fallback);
  } catch (_) { fallback(); }
}

/* ---------- data writes ---------- */
const queues = new Map();
function writeDoc(path, body) {
  const run = async () => {
    const ref = S.db.doc(path);
    try { await ref.set(body); }
    catch (e) {
      if (e && e.code === 'unavailable') { await sleep(300 + Math.random() * 500); await ref.set(body); }
      else throw e;
    }
  };
  const p = (queues.get(path) || Promise.resolve()).catch(() => {}).then(run);
  queues.set(path, p);
  return p;
}
function handleWriteError(e) {
  const code = e && e.code;
  if (code === 'invalid_argument' || code === 'not_granted' || code === 'revoked' || code === 'capability_disabled' || code === 'capability_removed') {
    S.canWrite = false; render();
    toast('השינוי לא נשמר: צריך להתחבר מחדש עם הסיסמה.');
  } else if (code === 'quota_exceeded') {
    toast('נגמר המקום לרשומות חדשות. מחיקת לקוחות ישנות תפנה מקום.');
  } else {
    toast('השינוי לא נשמר. בדיקת החיבור לאינטרנט ואז ניסיון נוסף.');
  }
}
function commit(prevC, nextC) {
  S.clients.set(nextC.id, nextC);
  render();
  return writeDoc('clients/' + nextC.id, toDoc(nextC)).catch(err => {
    if (prevC) S.clients.set(prevC.id, prevC); else S.clients.delete(nextC.id);
    render();
    handleWriteError(err);
    throw err;
  });
}
function guardWrite() {
  if (!S.db || S.status !== 'ready') { toast('אין חיבור לאחסון הנתונים כרגע.'); return false; }
  if (!S.canWrite) { toast('אין הרשאת עריכה בדף הזה.'); return false; }
  return true;
}
const prevOf = c => ({ p: c.punches, r: c.rewards, v: c.visits, lv: c.lastVisit });

function punch(id, fromList) {
  if (!guardWrite()) return;
  const c = S.clients.get(id);
  if (!c) return;
  const N = S.settings.cardSize, now = Date.now();
  if (c.punches >= N) { openSheet({ type: 'client', id }); return; }
  if (S.lastPunch && S.lastPunch.id === id && now - S.lastPunch.t < 700) return;
  S.lastPunch = { id, t: now };
  const np = c.punches + 1;
  const next = { ...c, punches: np, visits: c.visits + 1, lastVisit: now, updatedAt: now,
    log: [...c.log, { t: now, a: 'punch', p: np, prev: prevOf(c) }].slice(-LOG_MAX) };
  S.justPainted = { id, idx: c.punches, at: now };
  setTimeout(() => { if (S.justPainted && S.justPainted.at === now) S.justPainted = null; }, 1200);
  commit(c, next).catch(() => {});
  if (fromList) {
    if (np >= N) toast(`הכרטיסייה של ${firstName(c.name)} התמלאה. הטיפול הבא מתנה`, [{ label: 'וואטסאפ', fn: () => openWa(id, 'visit') }]);
    else toast(`ניקוב ל${firstName(c.name)} · ${np}/${N}`, [{ label: 'וואטסאפ', fn: () => openWa(id, 'visit') }, { label: 'ביטול', fn: () => undo(id, now) }]);
  }
}
function redeem(id) {
  if (!guardWrite()) return;
  const c = S.clients.get(id);
  const N = S.settings.cardSize;
  if (!c || c.punches < N) return;
  const now = Date.now(), np = Math.max(0, c.punches - N);
  const next = { ...c, punches: np, rewards: c.rewards + 1, visits: c.visits + 1, lastVisit: now, updatedAt: now,
    log: [...c.log, { t: now, a: 'redeem', p: np, prev: prevOf(c) }].slice(-LOG_MAX) };
  commit(c, next).catch(() => {});
  toast(`טיפול המתנה מומש ונפתחה כרטיסייה חדשה ל${firstName(c.name)}`, [{ label: 'וואטסאפ', fn: () => openWa(id, 'redeem') }]);
}
function undo(id, expectT) {
  if (!guardWrite()) return;
  const c = S.clients.get(id);
  if (!c) return;
  const e = c.log[c.log.length - 1];
  if (!e || !e.prev || !UNDO_LABEL[e.a]) return;

  const mod = ms => { const p = parts(ms); return p.h * 60 + p.mi; };
  const hm = ms => { const p = parts(ms); return `${pad(p.h)}:${pad(p.mi)}`; };
  const hhmm = m => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;

  const sheetOpen = S.stack.length > 0;
  let fabAct = null;

    else if (S.view === 'agenda' && A.loaded) fabAct = ['appt-new', 'תור חדש'];
  }
  fab.hidden = !fabAct;
  if (fabAct && fab.dataset.act !== fabAct[0]) { fab.dataset.act = fabAct[0]; fab.innerHTML = `${IC.plus}<span>${fabAct[1]}</span>`; }
  root.classList.toggle('locked', sheetOpen);

function setView(v) {

function paint(el, html) { if (el._last !== html) { el.innerHTML = html; el._last = html; } }

/* ---------- agenda ---------- */
function renderAgenda() {
  const v = $('#vAgenda');
  if (A.error && !A.loaded) { paint(v, `<div class="err-box">היומן לא נטען. בדיקת החיבור לאינטרנט ואז <button type="button" class="text-btn" data-act="reload">ניסיון נוסף</button></div>`); return; }
  if (!A.loaded) { paint(v, '<div class="skel-list" aria-hidden="true"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>'); return; }
  const today = T.today(), now = Date.now();
  if (!A.day) A.day = today;
  const key = A.day;
  const pend = A.list.filter(a => a.status === 'pending' && a.e > now).sort((x, y) => x.s - y.s);
  const toClose = A.list.filter(a => a.status === 'confirmed' && a.e <= now && a.e > now - 21 * DAY).sort((x, y) => x.s - y.s);
  const dayItems = A.list.filter(a => T.key(a.s) === key && a.status !== 'cancelled').sort((x, y) => x.s - y.s);
  const active = dayItems.filter(a => a.status !== 'noshow');
  const mins = active.reduce((t, a) => t + (a.minutes || 0), 0), money = active.reduce((t, a) => t + (Number(a.price) || 0), 0);
  const wins = dayWindows(key);
  const dayStart = T.zoned(key, 0), dayEnd = T.zoned(T.add(key, 1), 0);
  const blocks = A.blocks.filter(b => b.s < dayEnd && b.e > dayStart);
  const allDay = blocks.find(b => b.s <= dayStart && b.e >= dayEnd);
  let meta = active.length ? `${plural(active.length, 'תור אחד', 'תורים')} · ${fmtDur(mins)}${money ? ' · ' + fmtPrice(money) : ''}` : allDay ? 'יום חסום' : wins.length ? 'אין תורים' : 'יום סגור';
  if (key === today) {
    const nx = active.find(a => a.s >= now);
    if (nx) meta += ` · הבא ב־${T.hm(nx.s)} ${firstName(nx.name)}`;
  }

  const hr = T.parts(now).h;
  const hello = hr < 5 ? 'לילה טוב' : hr < 12 ? 'בוקר טוב' : hr < 17 ? 'צהריים טובים' : hr < 21 ? 'ערב טוב' : 'לילה טוב';
  const todays = A.list.filter(a => T.key(a.s) === today && (a.status === 'confirmed' || a.status === 'done'));
  const nextToday = todays.filter(a => a.s >= now && a.status === 'confirmed').sort((x, y) => x.s - y.s)[0];
  const headSub = todays.length ? `${plural(todays.length, 'תור אחד', 'תורים')} היום${nextToday ? ` · הבא ב־${T.hm(nextToday.s)} ${firstName(nextToday.name)}` : ''}` : 'אין תורים היום';
  let html = `<header class="top"><div class="brand"><div class="eyebrow">יומן התורים</div><h1 class="studio">${esc(hello)}${(S.full && S.full.ownerName) ? ', ' + esc(S.full.ownerName) : ''}</h1><div class="sub">${esc(headSub)}</div></div></header>`;
  if (pend.length) {
    html += `<div class="section-title"><h2>ממתינות לאישור</h2><span class="hint">${pend.length}</span></div><div class="pending">${pend.map(a => `
      <div class="req">
        <button type="button" class="req-top" data-act="appt-open" data-id="${esc(a.id)}">
          <span class="who">${esc(a.name)}${a.is_new ? '<span class="tag-new">לקוחה חדשה</span>' : ''}</span>
          <span class="what">${esc(a.service_name)} · ${esc(T.long(a.s))} · ${T.hm(a.s)}</span>
          <span class="when">ביקשה ${esc(relAgo(Date.parse(a.created_at)))}${a.addons && a.addons.length ? ' · ' + esc(a.addons.join(', ')) : ''}${a.note ? ' · ' + esc(a.note) : ''}</span>
        </button>
        <div class="req-actions">
          <button type="button" class="btn wa" data-act="appt-wa" data-id="${esc(a.id)}" data-tpl="photo">${IC.chat}<span>וואטסאפ</span></button>
          <button type="button" class="btn primary" data-act="appt-approve" data-id="${esc(a.id)}"${S.canWrite ? '' : ' disabled'}>אישור</button>
          <button type="button" class="btn ghost" data-act="appt-decline" data-id="${esc(a.id)}"${S.canWrite ? '' : ' disabled'}>דחייה</button>
        </div>
      </div>`).join('')}</div>`;
  }
  if (toClose.length) {
    html += `<div class="section-title"><h2>לסגור תורים שעברו</h2><span class="hint">כדי שהניקובים יתעדכנו</span></div><div class="toclose">${toClose.map(a => `
      <div class="req close">
        <button type="button" class="req-top" data-act="appt-open" data-id="${esc(a.id)}">
          <span class="who">${esc(a.name)}</span>
          <span class="what">${esc(a.service_name)} · ${esc(T.long(a.s))} · ${T.hm(a.s)}</span>
        </button>
        <div class="req-actions">
          <button type="button" class="btn primary" data-act="appt-done" data-id="${esc(a.id)}"${S.canWrite ? '' : ' disabled'}>הגיעה ✓</button>
          <button type="button" class="btn ghost" data-act="appt-noshow" data-id="${esc(a.id)}"${S.canWrite ? '' : ' disabled'}>לא הגיעה</button>
        </div>
      </div>`).join('')}</div>`;
  }
  const tmr = T.add(today, 1);
  const rem = A.list.filter(a => a.status === 'confirmed' && T.key(a.s) === tmr).sort((x, y) => x.s - y.s);
  if (rem.length) {
    const left = rem.filter(a => !a.reminded_at).length;
    html += `<div class="section-title" id="remindSec"><h2>תזכורות למחר</h2><span class="hint">${left ? `${left} מתוך ${rem.length} לשליחה` : 'כולן נשלחו ✓'}</span></div>`;
    if (left) html += `<div class="remind">${rem.map(remRow).join('')}</div>`;
  }

  const weekStart = T.add(key, -T.wd(key));
  const days = [0, 1, 2, 3, 4, 5, 6].map(i => T.add(weekStart, i));
  html += `<div class="weeknav">
      <button type="button" class="icon-btn" data-act="week" data-d="-7" aria-label="שבוע קודם"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
      <span class="lbl">${esc(T.month(key))}</span>
      ${key !== today ? '<button type="button" class="head-btn" data-act="go-today">היום</button>' : ''}
      <button type="button" class="icon-btn" data-act="week" data-d="7" aria-label="שבוע הבא"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
    </div>
    <div class="week">${days.map(k => {
      const n = A.list.filter(a => T.key(a.s) === k && (a.status === 'pending' || a.status === 'confirmed' || a.status === 'done')).length;
      const cls = ['wd', k === today ? 'today' : '', dayWindows(k).length ? '' : 'closed'].join(' ');
      return `<button type="button" class="${cls}" data-act="day" data-k="${k}" aria-pressed="${k === key}" aria-label="${esc(T.keyLong(k))}${n ? ', ' + n + ' תורים' : ''}"><span class="w">${WD_SHORT[T.wd(k)]}</span><span class="n">${+k.slice(8)}</span><span class="c">${n || ''}</span></button>`;
    }).join('')}</div>
    <div class="dayhead"><div class="dh-text"><h2>${esc(T.keyLong(key))}${key === today ? ' <span class="st confirmed">היום</span>' : ''}</h2><div class="meta">${esc(meta)}</div></div>${key >= today && !allDay && wins.length && S.canWrite ? `<button type="button" class="head-btn" data-act="block-day" data-k="${key}">סגירת שעות</button>` : ''}</div>`;

  const rows = [];
  for (const a of dayItems) {
    const past = a.e <= now && a.status === 'confirmed';
    rows.push({ t: a.s, html: `<button type="button" class="ap ${a.status}${past ? ' past' : ''}" data-act="appt-open" data-id="${esc(a.id)}"><span class="t">${T.hm(a.s)}<small>${T.hm(a.e)}</small></span><span class="mid"><span class="who">${esc(a.name)}</span><br><span class="svc">${esc(a.service_name)} · ${fmtDur(a.minutes)}${a.price != null ? ' · ' + fmtPrice(a.price) : ''}</span></span><span class="st ${a.status}">${ST_LABEL[a.status]}</span></button>` });
  }
  for (const b of blocks) {
    if (b === allDay) continue;
    rows.push({ t: b.s, html: `<div class="blockrow"><span>חסום · <span dir="ltr">${T.hm(Math.max(b.s, dayStart))}–${T.hm(Math.min(b.e, dayEnd))}</span>${b.reason ? ' · ' + esc(b.reason) : ''}</span><button type="button" class="mini-btn" data-act="block-open" data-id="${esc(b.id)}">עריכה</button></div>` });
  }
  if (!allDay) {
    const busy = [...A.list.filter(a => T.key(a.s) === key && (a.status === 'pending' || a.status === 'confirmed')).map(a => [T.mod(a.s), T.mod(a.e) || 1440]), ...blocks.map(b => [b.s <= dayStart ? 0 : T.mod(b.s), b.e >= dayEnd ? 1440 : T.mod(b.e)])].sort((x, y) => x[0] - y[0]);
    const nowMin = key === today ? T.mod(now) : key < today ? 1440 : -1;
    for (const [ws, we] of wins) {
      let cur = Math.max(ws, nowMin);
      for (const [s, e] of busy) {
        if (s >= we) break;
        if (e <= cur) continue;
        if (s > cur && s - cur >= 20) rows.push({ t: T.zoned(key, cur), html: gapRow(key, cur, s) });
        cur = Math.max(cur, e);
      }
      if (we - cur >= 20) rows.push({ t: T.zoned(key, cur), html: gapRow(key, cur, we) });
    }
  }
  rows.sort((x, y) => x.t - y.t);
  let body;
  if (allDay) body = `<div class="blockrow"><span>היום חסום${allDay.reason ? ' · ' + esc(allDay.reason) : ''}</span><button type="button" class="mini-btn" data-act="block-open" data-id="${esc(allDay.id)}">עריכה</button></div>` + rows.map(r => r.html).join('');
  else if (rows.length) body = rows.map(r => r.html).join('');
  else body = wins.length ? '<div class="empty-day"><b>אין תורים</b>אפשר להוסיף תור בכפתור למטה.</div>' : '<div class="empty-day"><b>יום סגור</b>שעות הפעילות נקבעות בלשונית «שעות».</div>';
  html += `<div class="agenda">${body}</div>`;
  paint(v, html);
}
function gapRow(key, s, e) {

}
function remRow(a) {

  </div>`;
}
async function markReminded(id) {

      <div class="text-row"><button type="button" class="text-btn" data-act="appt-noshow" data-id="${id}"${dis}>לא הגיעה</button><button type="button" class="text-btn danger-txt" data-act="appt-cancel" data-id="${id}"${dis}>ביטול התור</button></div>`;
  } else if (a.status === 'done') {

  } else {

      ${spec.confirmDelete

  return sheetHead(spec, esc(a.name)) + `<div class="sheet-body">

    <dl class="info">
      <div class="info-row"><dt>מתי</dt><dd>${esc(T.long(a.s))} · <span dir="ltr">${T.hm(a.s)}–${T.hm(a.e)}</span></dd></div>
      <div class="info-row"><dt>טיפול</dt><dd>${esc(a.service_name || '—')} · ${fmtDur(a.minutes)}</dd></div>

    </dl>
    ${(a.status === 'pending' || a.status === 'confirmed') && a.e > now - 3600e3 ? `<div class="extend"><span class="legend">צריך יותר זמן?</span><div class="chips">${[[15, 'עוד רבע שעה'], [30, 'עוד חצי שעה'], [60, 'עוד שעה']].map(([d, l]) => `<button type="button" class="chip" data-act="appt-extend" data-id="${id}" data-d="${d}"${dis}>${l}</button>`).join('')}</div></div>` : ''}
    ${card}
    <div class="actions">${actions}</div>
  </div>`;
}

async function submitAppt(spec) {
  if (!guardWrite()) return;
  const r = spec.inner;
  const name = $('#a-name', r).value.trim().replace(/\s+/g, ' ');
  const phone = $('#a-phone', r).value.trim();
  const key = $('#a-date', r).value, time = T.min($('#a-time', r).value);
  const minutes = clamp(parseInt($('#a-min', r).value, 10) || 0, 5, 480);
  const priceRaw = $('#a-price', r).value.trim();
  const svc = svcById($('#a-svc', r).value);
  const err = $('#a-err', r);
  $('#a-name-err', r).hidden = name.length >= 2;
  if (name.length < 2) { $('#a-name', r).focus(); return; }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(key) || time == null) { err.textContent = 'צריך תאריך ושעה.'; err.hidden = false; return; }
  const start = T.zoned(key, time), end = start + minutes * 60000;
  const p = normP(phone);
  const match = p ? [...S.clients.values()].find(c => normP(c.phone) === p) : [...S.clients.values()].find(c => c.name === name);
  const row = {
    starts_at: iso(start), ends_at: iso(end), minutes,
    service_id: svc ? svc.id : null, service_name: svc ? svc.name : 'טיפול',
    price: priceRaw === '' ? null : Number(priceRaw),
    name, phone: phone || (match ? match.phone : ''), note: $('#a-note', r).value.trim(),
  };
  if (match) row.client_id = match.id;
  const btn = $('#a-save', r);
  btn.disabled = true; err.hidden = true;
  let res;
  if (spec.id) res = await sb.from('appointments').update(row).eq('id', spec.id).select().single();
  else res = await sb.from('appointments').insert({ ...row, status: 'confirmed', source: 'admin', is_new: false }).select().single();
  if (res.error) {
    const e = dbErr(res.error);
    err.textContent = e.code === 'overlap' ? 'יש כבר תור שחופף לשעה הזו. בחרי שעה אחרת או קצרי את המשך.' : e.code === 'not_granted' ? 'אין הרשאה לשמור. צריך להתחבר מחדש.' : 'השמירה לא הצליחה. בדיקת החיבור לאינטרנט ואז ניסיון נוסף.';
    err.hidden = false; btn.disabled = false;
    return;
  }
  const saved = res.data;
  const newCard = !!(saved.client_id && !S.clients.has(saved.client_id) && await loadClient(saved.client_id));
  closeTop();
  A.day = T.key(start);
  await refreshBooking().catch(() => {});
  const msg = spec.id ? 'התור עודכן' : newCard ? `התור נשמר ו${firstName(name)} נוספה לכרטיסיות` : 'התור נשמר';
  toast(msg, saved.phone ? [{ label: 'וואטסאפ', fn: () => openApptWa(saved.id, 'confirm') }] : []);
}

/* ---------- appointment actions ---------- */
// The database opens a club card by itself when a booking is confirmed (see supabase/schema.sql).
// This brings that card into the screen right away, without waiting for the live update.
async function loadClient(id) {
  if (!id) return null;
  if (S.clients.has(id)) return S.clients.get(id);
  const { data, error } = await sb.from('clients').select('id,data').eq('id', id).maybeSingle();
  if (error || !data) return null;
  const c = normClient(data.id, data.data);
  S.clients.set(c.id, c);
  return c;
}
async function setApptStatus(id, patch) {
  const { data, error } = await sb.from('appointments').update(patch).eq('id', id).select().single();
  if (error) throw dbErr(error);
  const i = A.list.findIndex(a => a.id === id);
  const row = { ...data, s: Date.parse(data.starts_at), e: Date.parse(data.ends_at) };
  row.newCard = !!(row.client_id && !S.clients.has(row.client_id) && await loadClient(row.client_id));
  if (i >= 0) A.list[i] = row; else A.list.push(row);
  render();
  return row;
}
function apptFail(e) {
  if (e && e.code === 'overlap') toast('יש כבר תור אחר בשעה הזו, אז אי אפשר להחזיר אותו.');
  else handleWriteError(e);
}
async function approveAppt(id) {
  if (!guardWrite()) return;
  try {
    const row = await setApptStatus(id, { status: 'confirmed' });
    closeAll(true); render(); openApptWa(id, 'confirm');
    toast(row.newCard ? `התור אושר ו${firstName(row.name)} נוספה לכרטיסיות` : 'התור אושר');
  } catch (e) { apptFail(e); }
}
async function declineAppt(id) {
  if (!guardWrite()) return;
  try { await setApptStatus(id, { status: 'cancelled' }); closeAll(true); render(); openApptWa(id, 'decline'); toast('הבקשה נדחתה והשעה התפנתה'); }
  catch (e) { apptFail(e); }
}
async function cancelAppt(id) {
  if (!guardWrite()) return;
  try { await setApptStatus(id, { status: 'cancelled' }); closeAll(true); render(); toast('התור בוטל והשעה התפנתה', [{ label: 'הודעה ללקוחה', fn: () => openApptWa(id, 'cancel') }]); }
  catch (e) { apptFail(e); }
}
async function noShowAppt(id) {
  if (!guardWrite()) return;
  try { await setApptStatus(id, { status: 'noshow' }); toast('סומן שהלקוחה לא הגיעה', [{ label: 'ביטול', fn: () => setApptStatus(id, { status: 'confirmed' }).catch(apptFail) }]); }
  catch (e) { apptFail(e); }
}
async function reopenAppt(id) {
  if (!guardWrite()) return;
  try { await setApptStatus(id, { status: 'confirmed', punched: false }); toast('התור חזר להיות פעיל'); }
  catch (e) { apptFail(e); }
}
async function deleteAppt(id) {
  if (!guardWrite()) return;
  const { error } = await sb.from('appointments').delete().eq('id', id);
  if (error) { apptFail(dbErr(error)); return; }
  A.list = A.list.filter(a => a.id !== id);
  closeAll(); toast('התור נמחק');
}
async function completeAppt(id) {
  if (!guardWrite()) return;
  const a = apptById(id);
  if (!a || a.status !== 'confirmed') return;
  const svc = svcById(a.service_id), counts = svc ? svc.counts !== false : true;
  const N = S.settings.cardSize, now = Date.now();
  let c = null, kind = null;
  try {
    c = (a.client_id && await loadClient(a.client_id)) || clientForAppt(a);
    if (counts) {
      if (!c) {
        c = { id: newId(), name: a.name, phone: a.phone, g: 'f', notes: '', punches: 0, rewards: 0, visits: 0, createdAt: now, lastVisit: null, updatedAt: now, log: [{ t: now, a: 'join', p: 0 }] };
        await commit(null, c);
      }
      const prev = S.clients.get(c.id) || c;
      let next;
      if (prev.punches >= N) {
        const np = Math.max(0, prev.punches - N);
        next = { ...prev, punches: np, rewards: prev.rewards + 1, visits: prev.visits + 1, lastVisit: now, updatedAt: now, log: [...prev.log, { t: now, a: 'redeem', p: np, prev: prevOf(prev) }].slice(-LOG_MAX) };
        kind = 'redeem';
      } else {
        const np = prev.punches + 1;
        next = { ...prev, punches: np, visits: prev.visits + 1, lastVisit: now, updatedAt: now, log: [...prev.log, { t: now, a: 'punch', p: np, prev: prevOf(prev) }].slice(-LOG_MAX) };
        kind = 'punch';
        S.justPainted = { id: c.id, idx: prev.punches, at: now };
        setTimeout(() => { if (S.justPainted && S.justPainted.at === now) S.justPainted = null; }, 1200);
      }
      await commit(prev, next);
      c = next;
    }
    await setApptStatus(id, { status: 'done', punched: !!kind, client_id: c ? c.id : a.client_id });
    closeAll(true);
    if (c && kind) openWa(c.id, kind === 'redeem' ? 'redeem' : 'visit');
    else render();
    const msg = !kind ? 'הטיפול סומן כבוצע'
      : kind === 'redeem' ? `טיפול המתנה מומש ונפתחה כרטיסייה חדשה ל${firstName(a.name)}`
      : `ניקוב ל${firstName(a.name)} · ${Math.min(c.punches, N)}/${N}`;
    toast(msg, [{ label: 'ביטול', fn: () => undoComplete(id, kind ? c.id : null, now) }]);
  } catch (e) { handleWriteError(e); }
}
async function extendAppt(id, d) {
  if (!guardWrite()) return;
  const a = apptById(id);
  if (!a || !d) return;
  const prev = { ends_at: a.ends_at, minutes: a.minutes };
  const e = a.e + d * 60000;
  try {
    await setApptStatus(id, { ends_at: iso(e), minutes: (a.minutes || 0) + d });
    const clash = A.blocks.some(b => b.s < e && b.e > a.e);
    toast(`התור יסתיים ב־${T.hm(e)}${clash ? '. שימי לב: יש חסימה בזמן הזה' : ''}`, [{ label: 'ביטול', fn: () => setApptStatus(id, prev).catch(apptFail) }]);
  } catch (err) {
    if (err && err.code === 'overlap') toast('אי אפשר להאריך כל כך: מיד אחרי יש תור אחר.');
    else handleWriteError(err);
  }
}
async function undoComplete(apptId, clientId, t) {
  try {
    if (clientId) undo(clientId, t);
    await setApptStatus(apptId, { status: 'confirmed', punched: false });
  } catch (e) { handleWriteError(e); }
}

function fillTpl(text, vars) {
  const out = [];
  for (const line of String(text || '').replace(/\r/g, '').split('\n')) {
    let empty = false;
    const l = line.replace(/\{([^{}\n]{1,30})\}/g, (m, k) => {
      const key = k.trim();
      if (!Object.prototype.hasOwnProperty.call(vars, key)) return m;
      const v = vars[key];
      if (v == null || v === '') { empty = true; return ''; }
      return String(v);
    });
    if (empty) { if (out.length && /:\s*$/.test(out[out.length - 1])) out.pop(); continue; }
    out.push(l);
  }
  return out.join('\n').replace(/\n{3,}/g, '\n\n').trim();
}

/* ---------- phone alerts (Web Push through the "notify" server function) ---------- */
const FN_URL = (CFG.url || '') + '/functions/v1/notify';
A.push = { state: 'unknown', busy: false, devices: 0, endpoint: null, checking: false };
const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
const b64u = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const unb64u = s => { const t = s.replace(/-/g, '+').replace(/_/g, '/'); return Uint8Array.from(atob(t + '==='.slice((t.length + 3) % 4)), c => c.charCodeAt(0)); };
function notifyPrefs() {
  const n = (S.full && S.full.notify) || {}, h = Number(n.eveningHour);
  return { booking: n.booking !== false, eveningHour: n.eveningHour == null || !Number.isFinite(h) ? 20 : h };
}
async function callFn(body) {
  const r = await fetch(FN_URL, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: CFG.key }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error('notify ' + r.status), { code: 'unavailable' });
  return j;
}
async function swReg() {
  if (!('serviceWorker' in navigator)) return null;
  try { return await navigator.serviceWorker.register('sw.js', { scope: './' }); } catch (_) { return null; }
}
const deviceLabel = () => (isIOS() ? 'iPhone' : /Android/i.test(navigator.userAgent) ? 'Android' : /Mac/.test(navigator.platform) ? 'Mac' : /Win/.test(navigator.platform) ? 'Windows' : 'דפדפן');
async function saveSub(sub) {
  const j = sub.toJSON();
  const { error } = await sb.from('push_subs').upsert({ endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth, label: deviceLabel() });
  if (error) throw dbErr(error);
}
async function checkPush() {
  if (A.push.checking) return;
  A.push.checking = true;
  try {
    const ok = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
    if (!ok) A.push.state = isIOS() && !isStandalone() ? 'ios' : 'unsupported';
    else if (Notification.permission === 'denied') A.push.state = 'denied';
    else {
      const reg = await swReg();
      const sub = reg ? await reg.pushManager.getSubscription() : null;
      A.push.state = sub && Notification.permission === 'granted' ? 'on' : 'off';
      A.push.endpoint = sub ? sub.endpoint : null;
      if (A.push.state === 'on' && S.canWrite) await saveSub(sub).catch(() => {});
    }
    const { count } = await sb.from('push_subs').select('endpoint', { count: 'exact', head: true });
    A.push.devices = count || 0;
  } catch (_) {
    if (A.push.state === 'unknown') A.push.state = 'off';
  } finally { A.push.checking = false; render(); }
}
async function enablePush() {
  if (!guardWrite()) return;
  A.push.busy = true; render();
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { toast(perm === 'denied' ? 'ההתראות נחסמו. אפשר לאפשר אותן בהגדרות הדפדפן.' : 'ההתראות לא הופעלו.'); return; }
    const reg = await swReg();
    if (!reg) throw new Error('no service worker');
    await navigator.serviceWorker.ready;
    const { publicKey } = await callFn({ op: 'key' });
    if (!publicKey) throw new Error('no key');
    let sub = await reg.pushManager.getSubscription();
    if (sub && sub.options && sub.options.applicationServerKey && b64u(sub.options.applicationServerKey) !== publicKey) { await sub.unsubscribe(); sub = null; }
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: unb64u(publicKey) });
    await saveSub(sub);
    toast('ההתראות הופעלו ✓ אפשר לשלוח התראת בדיקה.');
  } catch (_) {
    toast('ההפעלה לא הצליחה. בדיקת החיבור לאינטרנט ואז ניסיון נוסף.');
  } finally { A.push.busy = false; A.push.state = 'unknown'; checkPush(); }
}
async function testPush() {
  A.push.busy = true; render();
  try {
    const r = await callFn({ op: 'test', endpoint: A.push.endpoint });
    if (r.ok && r.sent) toast('נשלחה התראת בדיקה. היא אמורה להופיע תוך כמה שניות.');
    else if (r.error === 'wait') toast('אפשר לשלוח בדיקה נוספת בעוד כמה שניות.');
    else if (r.error === 'unknown') toast('הטלפון הזה לא רשום. כדאי לכבות ולהפעיל שוב.');
    else toast('ההתראה לא נשלחה. כדאי לכבות ולהפעיל שוב.');
  } catch (_) { toast('אין חיבור לשרת ההתראות כרגע.'); }
  finally { A.push.busy = false; render(); }
}
async function disablePush() {
  A.push.busy = true; render();
  try {
    const reg = await swReg(), sub = reg ? await reg.pushManager.getSubscription() : null;
    if (sub) { await sb.from('push_subs').delete().eq('endpoint', sub.endpoint); await sub.unsubscribe(); }
    toast('ההתראות כובו בטלפון הזה');
  } catch (_) { toast('הכיבוי לא הצליח'); }
  finally { A.push.busy = false; A.push.state = 'unknown'; checkPush(); }
}

async function saveHours() {
  if (!guardWrite()) return;
  const d = A.hoursDraft, clean = {};
  for (let wd = 0; wd < 7; wd++) {
    const wins = (d[String(wd)] || []).filter(w => T.min(w.from) != null && T.min(w.to) != null);
    for (const w of wins) if (T.min(w.to) <= T.min(w.from)) { toast(`ביום ${WD_LONG[wd]} שעת הסיום מוקדמת מההתחלה.`); return; }
    clean[String(wd)] = wins.map(w => ({ from: w.from, to: w.to })).sort((a, b) => T.min(a.from) - T.min(b.from));
  }
  try { await mergeSettings({ hours: clean }); A.hoursDraft = null; A.hoursDirty = false; render(); toast('שעות הפעילות נשמרו'); }
  catch (e) { handleWriteError(e); }
}
async function deleteBlock(id) {
  if (!guardWrite()) return;
  const { error } = await sb.from('blocks').delete().eq('id', id);
  if (error) { handleWriteError(dbErr(error)); return; }
  closeAll(true);
  await refreshBooking().catch(() => {});
  toast('החסימה נמחקה');
}
async function deleteSvc(id) {
  if (!guardWrite()) return;
  const { error } = await sb.from('services').delete().eq('id', id);
  if (error) { handleWriteError(dbErr(error)); return; }
  closeAll(true);
  await refreshBooking().catch(() => {});
  toast('הטיפול נמחק');
}
function extraSubmit(id, spec, form) {
  if (id === 'loginForm') doLogin();
  else if (id === 'apptForm' && spec) submitAppt(spec);
  else if (id === 'blockForm' && spec) submitBlock(spec);
  else if (id === 'svcForm' && spec) submitSvc(spec);
  else if (id === 'tplForm' && spec) submitTpl(spec);
  else if (id === 'rulesForm') submitRules(form);
  else if (id === 'studioForm') submitStudio(form);
  else if (id === 'pwForm') submitPassword();
}
function extraInput(e) {
  const t = e.target, spec = topSheet();
  if (t.matches && t.matches('[data-hours]')) {
    const w = (A.hoursDraft[t.dataset.hours] || [])[+t.dataset.i];
    if (w) { w[t.dataset.f] = t.value; A.hoursDirty = true; const b = $('#hoursSave'); if (b) b.disabled = !S.canWrite; }
    return;
  }
  if (!spec) return;
  if (spec.type === 'tplForm' && t.id === 't-text') { updateTplPreview(spec); return; }
  if (spec.type === 'apptForm') {
    if (t.id === 'a-svc') {
      const s = svcById(t.value);
      if (s) { $('#a-min', spec.inner).value = s.minutes; $('#a-price', spec.inner).value = s.price == null ? '' : s.price; }
    }
    if (t.id === 'a-name') {
      const c = [...S.clients.values()].find(x => x.name === t.value.trim());
      const ph = $('#a-phone', spec.inner);
      if (c && c.phone && !ph.value) ph.value = c.phone;
    }
    if (['a-svc', 'a-date', 'a-min', 'a-time'].includes(t.id)) updateFreeChips(spec);
  }
}
document.addEventListener('change', e => {
  const t = e.target;
  if (t.matches && t.matches('[data-hours-toggle]')) {
    const wd = t.dataset.hoursToggle;
    A.hoursDraft[wd] = t.checked ? [{ from: '09:00', to: '19:00' }] : [];
    A.hoursDirty = true; render();
  } else if (t.id === 'b-all') {
    const box = $('#b-times'); if (box) box.hidden = t.checked;
  } else if (t.id === 'n-booking' || t.id === 'n-evening') {
    savePushPrefs();
  } else extraInput(e);
});

/* ---------- start ---------- */
let started = false;
async function startApp() {
  if (started) return;
  started = true;
  S.authed = true;
  try { const v = localStorage.getItem('sapinails.view'); if (['agenda', 'cards', 'hours', 'more'].includes(v)) S.view = v; } catch (_) {}
  render();
  let ok = false;
  try { const { data, error } = await sb.rpc('is_admin'); ok = !error && data === true; } catch (_) {}
  S.canWrite = ok;
  S.db = DB;
  if (!ok) {
    S.status = 'nodb';
    toast('החשבון הזה לא מורשה לנהל את הסטודיו.');
    render();
    return;
  }
  subscribe();
  const route = location.hash;
  refreshBooking().then(() => handleRoute(route)).catch(() => {});
  sb.channel('sapinails-admin')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'clients' }, () => notify('clients'))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'settings' }, () => notify('settings'))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'appointments' }, refreshSoon)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'blocks' }, refreshSoon)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'services' }, refreshSoon)
    .subscribe();
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { refreshSoon(); notify('clients'); }
  });
  window.addEventListener('hashchange', () => handleRoute(location.hash));
  setInterval(() => { if (document.visibilityState === 'visible') refreshSoon(); }, 120000);
}
async function boot() {
  $('#tabbar .in').innerHTML = [['agenda', 'יומן'], ['cards', 'כרטיסיות'], ['hours', 'שעות'], ['more', 'הגדרות']]
    .map(([k, l]) => `<button type="button" class="tab" data-act="tab" data-v="${k}">${TAB_ICONS[k]}<span>${l}</span>${k === 'agenda' ? '<span class="badge" id="pendBadge" hidden></span>' : ''}</button>`).join('');
  let session = null;
  try { const { data } = await sb.auth.getSession(); session = data && data.session; } catch (_) {}
  if (session) startApp();
  else { render(); setTimeout(() => { const p = $('#lPass'); if (p) p.focus(); }, 50); }
  sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT' && started) location.reload(); });
}
boot();

})();
</script>
